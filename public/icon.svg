<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0c1322"/>
      <stop offset="100%" stopColor="#05070c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="50%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#10b981"/>
    </linearGradient>
    <linearGradient id="alphaLoopGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="50%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#60a5fa"/>
    </linearGradient>
    <linearGradient id="breakoutArrowGrad" x1="30%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="60%" stopColor="#22d3ee"/>
      <stop offset="100%" stopColor="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="96" height="96" x="2" y="2" rx="22" stroke="url(#borderGrad)" stroke-width="2.5" fill="none"/>

  <!-- Alpha Greek Loop -->
  <path d="M 68 76 C 58 76 46 64 36 50 C 26 36 22 28 32 24 C 42 20 48 32 58 50 C 66 64 74 76 84 76" stroke="url(#alphaLoopGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-Velocity Upward Scalp Breakthrough Arrow -->
  <path d="M 28 76 L 56 36 L 78 22" stroke="url(#breakoutArrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 64 20 L 80 20 L 80 36" stroke="url(#breakoutArrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quant Center Trigger Point -->
  <circle cx="50" cy="50" r="5" fill="#22d3ee"/>
</svg>
